<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AimLock Prototype — Demo cho phát triển</title>
<style>
  :root{
    --bg:#0b0f14;
    --ui:#0ea5a4;
    --muted:#94a3b8;
    --accent:#f97316;
  }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,#071019 0%,var(--bg) 100%);font-family:Inter,system-ui,Segoe UI,Arial;color:#e6eef6}
  #app{position:relative;height:100vh;overflow:hidden}
  canvas{display:block;background:transparent}
  .ui {
    position: absolute;
    left: 12px;
    top: 12px;
    z-index: 50;
    background: rgba(8,12,16,0.45);
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.03);
    box-shadow: 0 6px 18px rgba(2,6,23,0.6);
    min-width: 220px;
  }
  .ui h1{margin:0;font-size:14px;color:var(--ui)}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px}
  button, .toggle {
    cursor:pointer;
    background:linear-gradient(180deg,#0f1724,#0b1220);
    color: #e6eef6;
    border:1px solid rgba(255,255,255,0.04);
    padding:8px 10px;border-radius:6px;font-size:13px;
  }
  .toggle.active{background:linear-gradient(180deg,var(--accent),#ffb86b);color:#071018}
  label{font-size:12px;color:var(--muted)}
  .badge{font-size:12px;padding:4px 6px;border-radius:6px;background:rgba(255,255,255,0.03)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .footer{position:absolute;right:12px;bottom:12px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div class="ui" id="ui">
    <h1>AimLock Prototype (dev only)</h1>
    <div class="row">
      <button id="spawnBtn">Spawn target</button>
      <button id="clearBtn">Clear</button>
      <div class="badge" id="count">0 targets</div>
    </div>

    <div class="row" style="margin-top:10px;">
      <button id="toggleBtn" class="toggle">AimLock: OFF (T)</button>
      <label style="margin-left:8px">Smooth: <input id="smoothRange" type="range" min="2" max="40" value="12"></label>
    </div>

    <div class="hint">Click to create a target. Move mouse to aim manually. Press <strong>T</strong> to toggle AimLock.</div>
  </div>

  <div class="footer">Demo không dùng cho cheat trên mạng — chỉ mẫu local cho dev</div>
</div>

<script>
// === Settings ===
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
});

// Entities: targets with head point
class Target {
  constructor(x,y){
    this.x = x; this.y = y;
    this.vx = (Math.random()*2-1)*1.2;
    this.vy = (Math.random()*2-1)*1.0;
    this.size = 24 + Math.random()*16;
    // head offset from center
    this.headOffsetY = -this.size*0.35;
    this.color = `hsl(${Math.floor(Math.random()*360)},70%,60%)`;
    this.id = Math.random().toString(36).slice(2,9);
    this.pulse = 0;
  }
  update(dt){
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    // bounce edges
    if(this.x < this.size) { this.x = this.size; this.vx *= -1 }
    if(this.x > w - this.size) { this.x = w - this.size; this.vx *= -1 }
    if(this.y < this.size) { this.y = this.size; this.vy *= -1 }
    if(this.y > h - this.size) { this.y = h - this.size; this.vy *= -1 }
    this.pulse += dt*0.015;
  }
  draw(ctx){
    // body
    ctx.save();
    ctx.translate(this.x,this.y);
    // shadow
    ctx.fillStyle = 'rgba(2,6,23,0.6)';
    ctx.beginPath();
    ctx.ellipse(0, this.size*0.7, this.size*0.9, this.size*0.35, 0,0,Math.PI*2);
    ctx.fill();
    // circle body
    ctx.beginPath();
    ctx.fillStyle = this.color;
    ctx.arc(0,0,this.size*0.9,0,Math.PI*2);
    ctx.fill();
    // head point
    const headY = this.headOffsetY;
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.arc(0, headY, Math.max(3, this.size*0.18 + Math.sin(this.pulse)*0.8), 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  headPoint(){
    return {x: this.x, y: this.y + this.headOffsetY};
  }
}

// Scene
const targets = [];
let last = performance.now();
let mouse = {x:w/2,y:h/2};
let aim = {x: w/2, y: h/2}; // crosshair position
let aimLock = false;
let smooth = 12; // smoothing factor (higher = slower)
const spawnBtn = document.getElementById('spawnBtn');
const clearBtn = document.getElementById('clearBtn');
const countBadge = document.getElementById('count');
const toggleBtn = document.getElementById('toggleBtn');
const smoothRange = document.getElementById('smoothRange');

smoothRange.addEventListener('input', e=> {
  smooth = Number(e.target.value);
});
spawnBtn.addEventListener('click', ()=> addRandomTarget());
clearBtn.addEventListener('click', ()=>{ targets.length = 0; updateCount(); });
toggleBtn.addEventListener('click', ()=> toggleAimLock());

canvas.addEventListener('mousemove', (e)=>{
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

// click to spawn
canvas.addEventListener('click', (e)=>{
  const rect = canvas.getBoundingClientRect();
  addTarget(e.clientX - rect.left, e.clientY - rect.top);
});

window.addEventListener('keydown', (e)=>{
  if(e.key.toLowerCase() === 't') toggleAimLock();
});

function toggleAimLock(){
  aimLock = !aimLock;
  toggleBtn.classList.toggle('active', aimLock);
  toggleBtn.textContent = `AimLock: ${aimLock ? 'ON' : 'OFF'} (T)`;
}

// Helpers
function addTarget(x,y){
  targets.push(new Target(x,y));
  updateCount();
}
function addRandomTarget(){
  addTarget(60 + Math.random()*(w-120), 60 + Math.random()*(h-120));
}
function updateCount(){
  countBadge.textContent = `${targets.length} target${targets.length===1?'':'s'}`;
}

// Find nearest target head to current aim/mouse
function findNearestHead(fromX, fromY){
  if(targets.length === 0) return null;
  let best = null;
  let bestDist = Infinity;
  for(const t of targets){
    const hp = t.headPoint();
    const dx = hp.x - fromX;
    const dy = hp.y - fromY;
    const d = dx*dx + dy*dy;
    if(d < bestDist){ bestDist = d; best = {target: t, hp, distSq: d}; }
  }
  return best;
}

// Main loop
function step(now){
  const dtMs = Math.min(40, now - last);
  last = now;
  const dt = dtMs * 0.06; // scale to comfortable movement

  // update
  targets.forEach(t => t.update(dt));

  // decide aim target: if aimLock true, lock to nearest head from current aim or mouse
  let targetHead = null;
  if(aimLock){
    // choose reference point (mouse location) to pick nearest target
    const pick = findNearestHead(aim.x, aim.y) || findNearestHead(mouse.x, mouse.y);
    if(pick) targetHead = pick.hp;
  }

  // update aim position: either follow mouse or smoothly lerp to targetHead
  if(targetHead){
    // smooth lerp: aim = lerp(aim, targetHead, alpha)
    const alpha = 1 / Math.max(1, smooth); // smooth controls speed
    aim.x += (targetHead.x - aim.x) * alpha;
    aim.y += (targetHead.y - aim.y) * alpha;
  } else {
    // follow mouse with smoothing
    const alpha = 1 / Math.max(1, smooth*0.6);
    aim.x += (mouse.x - aim.x) * alpha;
    aim.y += (mouse.y - aim.y) * alpha;
  }

  // draw
  render();

  requestAnimationFrame(step);
}

function render(){
  ctx.clearRect(0,0,w,h);

  // subtle grid/background
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'rgba(255,255,255,0.02)');
  grad.addColorStop(1,'rgba(255,255,255,0.00)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);

  // draw targets
  for(const t of targets) t.draw
